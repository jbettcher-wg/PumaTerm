<?xml version="1.0" encoding="UTF-8"?>
<!-- PumaTerm's icon: original artwork for this project, drawn as paths (no
     fonts), in Leopard's idiom: an aluminium frame around a dark glass
     screen, a lit prompt and cursor, a gloss across the top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ebee"/>
      <stop offset="0.5" stop-color="#b9bdc4"/>
      <stop offset="1" stop-color="#8d929a"/>
    </linearGradient>
    <linearGradient id="frameEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5d6168" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="0.6" stop-color="#0e131c"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- the aluminium frame -->
    <rect x="28" y="44" width="456" height="400" rx="56" fill="url(#frame)"/>
    <rect x="29.5" y="45.5" width="453" height="397" rx="55" fill="none"
          stroke="url(#frameEdge)" stroke-width="3"/>
    <!-- the screen -->
    <rect x="58" y="74" width="396" height="340" rx="30" fill="url(#screen)"/>
    <rect x="58" y="74" width="396" height="340" rx="30" fill="none"
          stroke="#000000" stroke-opacity="0.6" stroke-width="4"/>
  </g>

  <!-- scan lines, barely there -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="2">
    <line x1="62" y1="110" x2="450" y2="110"/><line x1="62" y1="150" x2="450" y2="150"/>
    <line x1="62" y1="190" x2="450" y2="190"/><line x1="62" y1="230" x2="450" y2="230"/>
    <line x1="62" y1="270" x2="450" y2="270"/><line x1="62" y1="310" x2="450" y2="310"/>
    <line x1="62" y1="350" x2="450" y2="350"/><line x1="62" y1="390" x2="450" y2="390"/>
  </g>

  <!-- the prompt: a chevron and a block cursor, with their glow -->
  <g filter="url(#soft)" opacity="0.75">
    <path d="M118 182 L206 244 L118 306" fill="none" stroke="#ff8c2a"
          stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="236" y="276" width="110" height="34" rx="6" fill="#ff8c2a"/>
  </g>
  <path d="M118 182 L206 244 L118 306" fill="none" stroke="url(#glow)"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="236" y="278" width="110" height="30" rx="5" fill="url(#glow)"/>

  <!-- gloss over the upper screen -->
  <path d="M58 104 Q58 74 88 74 L424 74 Q454 74 454 104 L454 190
           Q256 232 58 206 Z" fill="url(#gloss)"/>
</svg>
